<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Bookmark Desk</title><link rel="stylesheet" href="style.css"></head><body><h1>Save to Bookmark Desk</h1><p id="connection" role="status">Connecting…</p><form id="save"><label>Title<input id="title" maxlength="2048" required></label><label>URL<input id="url" readonly></label><label>Collections<select id="collections" multiple size="5"></select></label><label>Tags (comma separated)<input id="tags" maxlength="3200" list="known-tags"></label><datalist id="known-tags"></datalist><label><input id="remember" type="checkbox" checked> Use these collections/tags for right-click saves</label><button id="submit">Save</button></form><p id="status" role="status"></p><button id="setup">Setup / pending queue</button><script type="module" src="popup.js"></script></body></html>
